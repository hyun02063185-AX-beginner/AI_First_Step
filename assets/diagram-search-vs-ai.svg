<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">갈림길 — 검색과 AI 중 무엇을 쓸까</title>
  <desc id="d">질문 하나에서 두 갈래로 나뉜다. 왼쪽은 검색 — 사실·최신·출처가 필요할 때(예: 오늘 환율, 공식 규정). 오른쪽은 AI — 만들기·다듬기·이해가 필요할 때(예: 초안, 요약, 쉽게 설명). 두 갈래는 아래에서 다시 만나 검색으로 확인하고 AI로 정리하는 조합으로 합류한다. 찾을 것인가, 만들 것인가라는 문구로 마무리된다.</desc>
  <defs>
    <marker id="mc" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8" fill="#0E7490"/></marker>
    <marker id="mp" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8" fill="#DB2777"/></marker>
    <marker id="mv" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8" fill="#7C3AED"/></marker>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#24211C;font-weight:700;} .ts{fill:#7A736A;}
      .q{fill:#24211C;color:#FFFFFF;}
      .qNode{fill:#24211C;}
      .left{fill:#FFFFFF;stroke:#0E7490;stroke-width:2.4;}
      .right{fill:#FFFFFF;stroke:#DB2777;stroke-width:2.4;}
      .both{fill:#FFF7FB;stroke:#7C3AED;stroke-width:2.4;}
      .lbl{fill:#24211C;font-weight:700;} .sub{fill:#7A736A;}
      .flowL{fill:none;stroke:#0E7490;stroke-width:2.4;}
      .flowR{fill:none;stroke:#DB2777;stroke-width:2.4;}
      .flowV{fill:none;stroke:#7C3AED;stroke-width:2.4;}
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" rx="28" fill="#FAF7F2"/>
  <text x="48" y="64" font-size="30" class="tt">갈림길</text>
  <text x="50" y="96" font-size="16" class="ts">같은 질문도, 무엇이 필요하냐에 따라 길이 갈린다</text>

  <!-- 질문 노드 -->
  <rect x="520" y="128" width="240" height="86" rx="43" class="qNode"/>
  <text x="640" y="178" font-size="22" text-anchor="middle" fill="#FFFFFF" font-weight="700">❓ 질문</text>

  <!-- 좌우 분기선 -->
  <path d="M540 210 C 460 240, 400 250, 350 258" class="flowL" marker-end="url(#mc)"/>
  <path d="M740 210 C 820 240, 880 250, 930 258" class="flowR" marker-end="url(#mp)"/>

  <!-- 왼쪽: 검색 -->
  <rect x="130" y="260" width="430" height="190" rx="18" class="left"/>
  <text x="160" y="308" font-size="30">🔍</text>
  <text x="204" y="308" font-size="22" font-weight="700" fill="#0E7490">검색</text>
  <text x="160" y="340" font-size="15" class="sub">사실 · 최신 · 출처가 필요할 때</text>
  <line x1="160" y1="362" x2="530" y2="362" stroke="#EAE4DA" stroke-width="1.4"/>
  <text x="160" y="392" font-size="14" class="lbl">예: 오늘 환율</text>
  <text x="160" y="416" font-size="14" class="lbl">예: 공식 규정·법령</text>

  <!-- 오른쪽: AI -->
  <rect x="720" y="260" width="430" height="190" rx="18" class="right"/>
  <text x="750" y="308" font-size="30">💬</text>
  <text x="794" y="308" font-size="22" font-weight="700" fill="#DB2777">AI</text>
  <text x="750" y="340" font-size="15" class="sub">만들기 · 다듬기 · 이해가 필요할 때</text>
  <line x1="750" y1="362" x2="1120" y2="362" stroke="#EAE4DA" stroke-width="1.4"/>
  <text x="750" y="392" font-size="14" class="lbl">예: 초안 · 요약</text>
  <text x="750" y="416" font-size="14" class="lbl">예: 쉽게 설명하기</text>

  <!-- 합류선 -->
  <path d="M345 450 C 345 480, 450 500, 560 508" class="flowV" marker-end="url(#mv)"/>
  <path d="M935 450 C 935 480, 830 500, 720 508" class="flowV" marker-end="url(#mv)"/>

  <!-- 합류: 둘 다 쓰기 -->
  <rect x="390" y="460" width="500" height="120" rx="18" class="both"/>
  <text x="640" y="502" font-size="21" text-anchor="middle" font-weight="700" fill="#7C3AED">둘 다 쓰기</text>
  <text x="640" y="528" font-size="14" text-anchor="middle" class="sub">검색으로 확인하고, AI로 정리한다</text>

  <!-- 보조 문구 -->
  <rect x="330" y="606" width="620" height="66" rx="18" fill="#FFFFFF" stroke="#EAE4DA" stroke-width="1.6"/>
  <text x="640" y="646" font-size="19" text-anchor="middle" font-weight="700" fill="#0E7490">찾을 것인가, 만들 것인가</text>
</svg>
