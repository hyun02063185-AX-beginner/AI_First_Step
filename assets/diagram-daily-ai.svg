<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">하루 속 AI 지도 — 출근길부터 퇴근까지</title>
  <desc id="d">아침 출근길의 지도 앱과 음악 추천, 오전 사무실의 스팸 필터와 문서 자동완성, 점심의 맛집 별점 정렬과 사진 보정, 오후의 번역기와 화상회의 자막, 퇴근길의 영상 추천까지 — 하루 다섯 장면 모두에 이미 AI가 있었다.</desc>
  <defs>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3.2" fill="#0E7490"/></marker>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#24211C;font-weight:700;} .ts{fill:#7A736A;}
      .node{fill:#FFFFFF;stroke:#0E7490;stroke-width:2.2;}
      .badge{fill:#0E7490;}
      .badgeTxt{fill:#FFFFFF;font-weight:700;}
      .item{fill:#24211C;} .itemSub{fill:#7A736A;}
      .track{stroke:#EAE4DA;stroke-width:6;stroke-linecap:round;}
      .flow{stroke:#0E7490;stroke-width:2;stroke-dasharray:2 8;stroke-linecap:round;}
      .spark{fill:#DB2777;}
      .sparkAlt{fill:#7C3AED;}
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" rx="28" fill="#FAF7F2"/>

  <text x="48" y="66" font-size="30" class="tt">하루 속 AI 지도</text>
  <text x="50" y="98" font-size="16" class="ts">아침부터 저녁까지 — 오늘도 여러 번 만났다</text>

  <!-- 타임라인 트랙 -->
  <line x1="150" y1="420" x2="1170" y2="420" class="track"/>
  <line x1="150" y1="420" x2="1170" y2="420" class="flow"/>

  <!-- 노드 1: 출근길 -->
  <g>
    <rect x="90" y="270" width="120" height="40" rx="20" class="badge"/>
    <text x="150" y="296" font-size="17" text-anchor="middle" class="badgeTxt">🌅 출근길</text>
    <circle cx="150" cy="420" r="56" class="node"/>
    <text x="150" y="435" font-size="34" text-anchor="middle">🚗</text>
    <circle cx="196" cy="374" r="12" class="spark"/>
    <text x="196" y="379" font-size="14" text-anchor="middle" fill="#FFFFFF">✦</text>
    <text x="150" y="512" font-size="15.5" text-anchor="middle" class="item">지도 앱 빠른 경로</text>
    <text x="150" y="536" font-size="15.5" text-anchor="middle" class="item">음악 추천</text>
  </g>

  <!-- 노드 2: 오전 -->
  <g>
    <rect x="345" y="270" width="120" height="40" rx="20" class="badge"/>
    <text x="405" y="296" font-size="17" text-anchor="middle" class="badgeTxt">🏢 오전</text>
    <circle cx="405" cy="420" r="56" class="node"/>
    <text x="405" y="435" font-size="34" text-anchor="middle">📧</text>
    <circle cx="451" cy="374" r="12" class="sparkAlt"/>
    <text x="451" y="379" font-size="14" text-anchor="middle" fill="#FFFFFF">✦</text>
    <text x="405" y="512" font-size="15.5" text-anchor="middle" class="item">스팸 필터</text>
    <text x="405" y="536" font-size="15.5" text-anchor="middle" class="item">문서 자동완성</text>
  </g>

  <!-- 노드 3: 점심 -->
  <g>
    <rect x="600" y="270" width="120" height="40" rx="20" class="badge"/>
    <text x="660" y="296" font-size="17" text-anchor="middle" class="badgeTxt">🍚 점심</text>
    <circle cx="660" cy="420" r="56" class="node"/>
    <text x="660" y="435" font-size="34" text-anchor="middle">🍜</text>
    <circle cx="706" cy="374" r="12" class="spark"/>
    <text x="706" y="379" font-size="14" text-anchor="middle" fill="#FFFFFF">✦</text>
    <text x="660" y="512" font-size="15.5" text-anchor="middle" class="item">맛집 별점 정렬</text>
    <text x="660" y="536" font-size="15.5" text-anchor="middle" class="item">사진 보정</text>
  </g>

  <!-- 노드 4: 오후 -->
  <g>
    <rect x="855" y="270" width="120" height="40" rx="20" class="badge"/>
    <text x="915" y="296" font-size="17" text-anchor="middle" class="badgeTxt">💻 오후</text>
    <circle cx="915" cy="420" r="56" class="node"/>
    <text x="915" y="435" font-size="34" text-anchor="middle">🌐</text>
    <circle cx="961" cy="374" r="12" class="sparkAlt"/>
    <text x="961" y="379" font-size="14" text-anchor="middle" fill="#FFFFFF">✦</text>
    <text x="915" y="512" font-size="15.5" text-anchor="middle" class="item">번역기</text>
    <text x="915" y="536" font-size="15.5" text-anchor="middle" class="item">화상회의 자막</text>
  </g>

  <!-- 노드 5: 퇴근 -->
  <g>
    <rect x="1100" y="270" width="120" height="40" rx="20" class="badge"/>
    <text x="1160" y="296" font-size="17" text-anchor="middle" class="badgeTxt">🌙 퇴근</text>
    <circle cx="1160" cy="420" r="56" class="node"/>
    <text x="1160" y="435" font-size="34" text-anchor="middle">🎬</text>
    <circle cx="1206" cy="374" r="12" class="spark"/>
    <text x="1206" y="379" font-size="14" text-anchor="middle" fill="#FFFFFF">✦</text>
    <text x="1160" y="524" font-size="15.5" text-anchor="middle" class="item">영상 추천</text>
  </g>

  <!-- 보조 문구 -->
  <rect x="230" y="606" width="820" height="66" rx="18" fill="#FFFFFF" stroke="#EAE4DA" stroke-width="1.6"/>
  <text x="640" y="646" font-size="19" text-anchor="middle" font-weight="700" fill="#0E7490">오늘 하루, 이미 여러 번 만났다</text>
</svg>
