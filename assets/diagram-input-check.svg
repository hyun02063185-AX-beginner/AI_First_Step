<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">넣기 전 신호등 — 무엇을 AI에 넣어도 될까</title>
  <desc id="d">신호등 세 칸. 빨강은 고객 개인정보·계약서·비밀번호로 입력창까지 가지 못하고 막힌다. 노랑은 업무 문서로 이름과 금액을 지우는 필터를 거쳐 입력창에 들어간다. 초록은 공개 정보·내 메모·일반 질문으로 곧장 입력창에 들어간다. 빨간불만 피하면 나머지는 마음 놓고 쓸 수 있다는 문구로 마무리된다.</desc>
  <defs>
    <marker id="mRed" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8" fill="#C0392B"/></marker>
    <marker id="mAmb" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8" fill="#B7791F"/></marker>
    <marker id="mGrn" markerWidth="11" markerHeight="11" refX="7.5" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8" fill="#047857"/></marker>
    <style><![CDATA[
      text{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;}
      .tt{fill:#24211C;font-weight:700;} .ts{fill:#7A736A;}
      .housing{fill:#24211C;}
      .card{fill:#FFFFFF;stroke:#EAE4DA;stroke-width:1.8;}
      .lbl{fill:#24211C;font-weight:700;} .sub{fill:#7A736A;}
      .inputBox{fill:#FFFFFF;stroke:#0E7490;stroke-width:2.4;}
      .redLine{fill:none;stroke:#C0392B;stroke-width:2.4;stroke-dasharray:5 6;}
      .ambLine{fill:none;stroke:#B7791F;stroke-width:2.4;}
      .grnLine{fill:none;stroke:#047857;stroke-width:2.4;}
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" rx="28" fill="#FAF7F2"/>
  <text x="48" y="64" font-size="30" class="tt">넣기 전 신호등</text>
  <text x="50" y="96" font-size="16" class="ts">넣기 전 3초 — 이 셋만 구분하면 된다</text>

  <!-- 신호등 본체 -->
  <rect x="80" y="170" width="120" height="390" rx="32" class="housing"/>
  <circle cx="140" cy="255" r="40" fill="#C0392B"/>
  <circle cx="140" cy="365" r="40" fill="#D9A441"/>
  <circle cx="140" cy="475" r="40" fill="#3FA66B"/>

  <!-- 빨강 행 -->
  <rect x="250" y="210" width="500" height="90" rx="16" class="card"/>
  <text x="278" y="242" font-size="18" font-weight="700" fill="#C0392B">🔴 빨강 — 넣지 않는 것</text>
  <text x="278" y="270" font-size="14" class="sub">고객 개인정보 · 계약서 · 비밀번호</text>
  <path d="M752 255 C 800 255, 820 255, 845 255" class="redLine" marker-end="url(#mRed)"/>
  <circle cx="862" cy="255" r="16" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.6"/>
  <text x="862" y="261" font-size="16" text-anchor="middle" fill="#C0392B" font-weight="700">✕</text>

  <!-- 노랑 행 -->
  <rect x="250" y="320" width="500" height="90" rx="16" class="card"/>
  <text x="278" y="352" font-size="18" font-weight="700" fill="#B7791F">🟡 노랑 — 지우고 넣는 것</text>
  <text x="278" y="380" font-size="14" class="sub">업무 문서 — 이름·금액만 지우면 OK</text>
  <path d="M752 365 C 800 365, 815 365, 832 365" class="ambLine" marker-end="url(#mAmb)"/>
  <circle cx="850" cy="365" r="16" fill="#FFF7E8" stroke="#B7791F" stroke-width="2"/>
  <text x="850" y="371" font-size="15" text-anchor="middle">✂️</text>
  <path d="M866 365 C 890 365, 900 380, 915 385" class="ambLine" marker-end="url(#mAmb)"/>

  <!-- 초록 행 -->
  <rect x="250" y="430" width="500" height="90" rx="16" class="card"/>
  <text x="278" y="462" font-size="18" font-weight="700" fill="#047857">🟢 초록 — 그냥 넣기</text>
  <text x="278" y="490" font-size="14" class="sub">공개 정보 · 내 메모 · 일반 질문</text>
  <path d="M752 475 C 800 475, 850 440, 900 410" class="grnLine" marker-end="url(#mGrn)"/>

  <!-- 입력창 -->
  <rect x="930" y="330" width="280" height="170" rx="20" class="inputBox"/>
  <text x="1070" y="405" font-size="42" text-anchor="middle">💬</text>
  <text x="1070" y="450" font-size="18" text-anchor="middle" font-weight="700" fill="#0E7490">AI 입력창</text>
  <text x="1070" y="472" font-size="12.5" text-anchor="middle" class="sub">여기로 들어간다</text>

  <!-- 보조 문구 -->
  <rect x="230" y="606" width="820" height="66" rx="18" fill="#FFFFFF" stroke="#EAE4DA" stroke-width="1.6"/>
  <text x="640" y="646" font-size="19" text-anchor="middle" font-weight="700" fill="#0E7490">빨간불만 피하면, 나머지는 마음 놓고</text>
</svg>
